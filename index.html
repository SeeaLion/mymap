
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야구장 주변 맛집 지도</title>

    <style>
        /* 기본 화면 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* 왼쪽 목록과 오른쪽 지도를 나눔 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            padding: 20px;
            overflow-y: auto;
            background: #ffffff;
            border-right: 1px solid #dddddd;
        }

        h1 {
            margin-top: 0;
            font-size: 23px;
        }

        /* 탭 버튼 설정 */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 5px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .tab-button.active {
            background: #fee500;
            border-color: #e6cf00;
        }

        /* 안내 문구 */
        #status {
            margin: 12px 0;
            color: #666666;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 검색 결과 목록 */
        #resultList {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .place-item {
            padding: 14px 5px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
        }

        .place-item:hover {
            background: #f8f8f8;
        }

        .place-name {
            margin-bottom: 7px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-address {
            margin-bottom: 6px;
            color: #555555;
            font-size: 12px;
            line-height: 1.5;
        }

        .place-category {
            color: #888888;
            font-size: 11px;
        }

        .place-link {
            display: inline-block;
            margin-top: 7px;
            color: #2675d8;
            font-size: 12px;
            text-decoration: none;
        }

        /* 페이지 이동 버튼 */
        #pagination {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 16px;
        }

        .page-button {
            padding: 7px 10px;
            border: 1px solid #dddddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        .page-button.active {
            background: #fee500;
            font-weight: bold;
        }

        .page-button:disabled {
            color: #aaaaaa;
            cursor: default;
        }

        /* 지도 영역 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #eeeeee;
        }

        /* 지도 위 장소 마커 */
        .map-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 6px #00000040;
            cursor: pointer;
            user-select: none;
        }

        /* 야구장 마커는 크게 표시 */
        .stadium-marker {
            width: 54px;
            height: 54px;
            background: #263d77;
            font-size: 31px;
        }

        /* 음식점과 카페 마커는 작게 표시 */
        .restaurant-marker {
            width: 30px;
            height: 30px;
            background: #ffb347;
            font-size: 17px;
        }

        .cafe-marker {
            width: 30px;
            height: 30px;
            background: #a77b55;
            font-size: 17px;
        }

        /* 장소 상세 팝업 */
        .popup-content {
            min-width: 150px;
            max-width: 230px;
            padding: 10px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 8px #00000030;
            font-size: 13px;
            line-height: 1.5;
        }

        .popup-name {
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* 작은 화면에서는 위아래로 배치 */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 45%;
                padding: 14px;
                border-right: none;
                border-bottom: 1px solid #dddddd;
            }

            #map {
                width: 100%;
                height: 55%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 탭과 검색 결과 영역 -->
        <aside class="sidebar">
            <h1>⚾ 야구장 주변 지도</h1>

            <!-- 탭 2개 -->
            <div class="tab-container">
                <button
                    class="tab-button active"
                    id="restaurantTab"
                    type="button">
                    🍜 주변 맛집
                </button>

                <button
                    class="tab-button"
                    id="cafeTab"
                    type="button">
                    ☕ 주변 카페
                </button>
            </div>

            <p id="status">현재 위치를 확인하고 있습니다...</p>

            <ul id="resultList"></ul>

            <!-- 검색 결과 페이지 이동 버튼 -->
            <div id="pagination"></div>
        </aside>

        <!-- 오른쪽 지도 -->
        <div id="map"></div>
    </div>

    <!-- 카카오맵 SDK -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=24fe99dfd587292498c30233911527f8&autoload=false&libraries=services">
    </script>

    <script>
        // 지도와 장소 검색에 사용할 변수
        let map;
        let placesService;
        let searchCenter;
        let stadiumMarker = null;
        let resultMarkers = [];
        let activePopup = null;
        let currentPagination = null;
        let currentTab = "restaurant";
        let searchRequestId = 0;

        // 탭별 검색 코드와 마커 모양
        const tabSettings = {
            restaurant: {
                name: "야구장 주변 맛집",
                code: "FD6",
                markerClass: "restaurant-marker",
                icon: "🍜"
            },
            cafe: {
                name: "야구장 주변 카페",
                code: "CE7",
                markerClass: "cafe-marker",
                icon: "☕"
            }
        };

        // HTML 요소 가져오기
        const statusText = document.getElementById("status");
        const resultList = document.getElementById("resultList");
        const paginationBox = document.getElementById("pagination");
        const restaurantTab = document.getElementById("restaurantTab");
        const cafeTab = document.getElementById("cafeTab");

        // 카카오맵 SDK가 준비되면 지도 생성
        kakao.maps.load(function () {
            // 기본 위치는 서울시청
            const defaultPosition = new kakao.maps.LatLng(
                37.5665,
                126.9780
            );

            // 지도 생성
            map = new kakao.maps.Map(
                document.getElementById("map"),
                {
                    center: defaultPosition,
                    level: 5
                }
            );

            // 장소 검색 서비스 생성
            placesService = new kakao.maps.services.Places(map);

            // 탭 버튼 이벤트 설정
            restaurantTab.addEventListener("click", function () {
                changeTab("restaurant");
            });

            cafeTab.addEventListener("click", function () {
                changeTab("cafe");
            });

            // 현재 위치를 확인한 후 주변 야구장 검색
            getCurrentLocation();
        });

        // 현재 위치를 확인하는 함수
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                searchCenter = map.getCenter();
                findNearbyStadium();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 현재 위치의 위도와 경도 가져오기
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    // 현재 위치를 검색 중심으로 설정
                    searchCenter = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    map.setCenter(searchCenter);

                    // 현재 위치 주변의 야구장 검색
                    findNearbyStadium();
                },
                function () {
                    // 위치 권한을 허용하지 않으면 기본 위치 사용
                    searchCenter = map.getCenter();

                    statusText.textContent =
                        "현재 위치를 확인하지 못했습니다. 기본 위치에서 야구장을 찾습니다.";

                    findNearbyStadium();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 현재 위치 주변의 야구장을 검색하는 함수
        function findNearbyStadium() {
            statusText.textContent = "주변 야구장을 찾고 있습니다...";

            placesService.keywordSearch(
                "야구장",
                function (data, status) {
                    if (
                        status === kakao.maps.services.Status.OK &&
                        data.length > 0
                    ) {
                        // 검색된 야구장 중 첫 번째 장소를 기준으로 설정
                        const stadium = data[0];

                        searchCenter = new kakao.maps.LatLng(
                            stadium.y,
                            stadium.x
                        );

                        map.setCenter(searchCenter);
                        map.setLevel(4);

                        // 큰 야구장 마커 표시
                        stadiumMarker = createCustomMarker(
                            searchCenter,
                            "⚾",
                            "stadium-marker",
                            stadium,
                            10
                        );

                        // 첫 번째 탭의 맛집 검색
                        changeTab("restaurant");
                    } else {
                        // 주변 야구장을 찾지 못하면 현재 위치를 사용
                        statusText.textContent =
                            "주변 야구장을 찾지 못해 현재 지도 중심을 기준으로 검색합니다.";

                        changeTab("restaurant");
                    }
                },
                {
                    location: searchCenter,
                    radius: 20000,
                    size: 15,
                    sort: kakao.maps.services.SortBy.DISTANCE
                }
            );
        }

        // 탭을 바꾸는 함수
        function changeTab(tabName) {
            currentTab = tabName;

            // 이전 검색 요청의 결과가 뒤늦게 표시되지 않도록 번호 변경
            searchRequestId++;

            // 이전 마커, 팝업, 목록 제거
            clearResults();

            // 선택한 탭을 노란색으로 표시
            restaurantTab.classList.toggle(
                "active",
                tabName === "restaurant"
            );

            cafeTab.classList.toggle(
                "active",
                tabName === "cafe"
            );

            // 선택한 탭의 카테고리 코드 가져오기
            const settings = tabSettings[tabName];

            statusText.textContent =
                settings.name + "을 검색하고 있습니다...";

            // 선택한 카테고리로 장소 검색
            searchCategory(1);
        }

        // 카테고리별 장소 검색 함수
        function searchCategory(pageNumber) {
            const settings = tabSettings[currentTab];
            const requestId = searchRequestId;

            // 야구장 또는 검색 중심 주변 3km 이내 검색
            placesService.categorySearch(
                settings.code,
                function (data, status, pagination) {
                    // 이전 탭의 검색 결과라면 표시하지 않음
                    if (requestId !== searchRequestId) {
                        return;
                    }

                    if (status === kakao.maps.services.Status.OK) {
                        currentPagination = pagination;

                        // 현재 페이지의 결과만 표시
                        displayPlaces(data);

                        // 페이지 버튼 표시
                        displayPagination(pagination);

                        statusText.textContent =
                            settings.name + " 검색 결과: " +
                            data.length + "개";
                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        statusText.textContent =
                            "주변에 검색 결과가 없습니다.";

                        currentPagination = null;
                        paginationBox.innerHTML = "";
                    } else {
                        statusText.textContent =
                            "검색 중 오류가 발생했습니다. 다시 시도해 주세요.";

                        currentPagination = null;
                        paginationBox.innerHTML = "";
                    }
                },
                {
                    location: searchCenter,
                    radius: 3000,
                    size: 15,
                    sort: kakao.maps.services.SortBy.DISTANCE,
                    page: pageNumber
                }
            );
        }

        // 검색 결과를 지도와 목록에 표시
        function displayPlaces(places) {
            const settings = tabSettings[currentTab];
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(function (place) {
                // 장소 위치 생성
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                // 탭에 따라 다른 마커 생성
                const marker = createCustomMarker(
                    position,
                    settings.icon,
                    settings.markerClass,
                    place,
                    5
                );

                resultMarkers.push(marker);
                bounds.extend(position);

                // 왼쪽 목록 항목 생성
                const listItem = document.createElement("li");
                listItem.className = "place-item";

                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = place.place_name;

                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                const category = document.createElement("div");
                category.className = "place-category";
                category.textContent =
                    place.category_name || "분류 정보 없음";

                // 카카오맵 상세 페이지 링크
                const link = document.createElement("a");
                link.className = "place-link";
                link.href = place.place_url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "카카오맵에서 보기";

                // 링크를 누를 때 목록 클릭 이벤트가 실행되지 않도록 설정
                link.addEventListener("click", function (event) {
                    event.stopPropagation();
                });

                listItem.appendChild(name);
                listItem.appendChild(address);
                listItem.appendChild(category);
                listItem.appendChild(link);

                // 목록을 누르면 해당 장소로 이동하고 상세 팝업 표시
                listItem.addEventListener("click", function () {
                    map.setCenter(position);
                    map.setLevel(3);
                    showPlacePopup(position, place);
                });

                resultList.appendChild(listItem);
            });

            // 검색 결과가 모두 보이도록 지도 범위 조절
            if (places.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 이미지 대신 이모지와 CSS를 사용해 커스텀 마커 생성
        function createCustomMarker(
            position,
            icon,
            markerClass,
            place,
            zIndex
        ) {
            const markerElement = document.createElement("div");

            markerElement.className =
                "map-marker " + markerClass;

            markerElement.textContent = icon;
            markerElement.title = place.place_name || "야구장";

            // 커스텀 오버레이 생성
            const marker = new kakao.maps.CustomOverlay({
                position: position,
                content: markerElement,
                yAnchor: 1,
                zIndex: zIndex,
                clickable: true
            });

            marker.setMap(map);

            // 마커를 클릭하면 장소 상세 정보 표시
            markerElement.addEventListener("click", function (event) {
                event.stopPropagation();
                map.setCenter(position);
                showPlacePopup(position, place);
            });

            return marker;
        }

        // 장소 이름과 주소를 팝업으로 표시
        function showPlacePopup(position, place) {
            // 이전 팝업 닫기
            if (activePopup) {
                activePopup.setMap(null);
            }

            const popup = document.createElement("div");
            popup.className = "popup-content";

            const name = document.createElement("div");
            name.className = "popup-name";
            name.textContent = place.place_name || "야구장";

            const address = document.createElement("div");
            address.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            popup.appendChild(name);
            popup.appendChild(address);

            // 선택한 마커 위에 팝업 표시
            activePopup = new kakao.maps.CustomOverlay({
                position: position,
                content: popup,
                yAnchor: 1.8,
                zIndex: 20,
                clickable: true
            });

            activePopup.setMap(map);
        }

        // 검색 결과 페이지 버튼 생성
        function displayPagination(pagination) {
            paginationBox.innerHTML = "";

            // 이전 페이지 버튼
            const previousButton = document.createElement("button");
            previousButton.className = "page-button";
            previousButton.textContent = "이전";
            previousButton.disabled = pagination.current <= 1;

            previousButton.addEventListener("click", function () {
                if (pagination.current > 1) {
                    searchCategory(pagination.current - 1);
                }
            });

            paginationBox.appendChild(previousButton);

            // 페이지 번호 버튼
            for (
                let page = 1;
                page <= pagination.last;
                page++
            ) {
                const pageButton = document.createElement("button");
                pageButton.className = "page-button";
                pageButton.textContent = page;

                if (page === pagination.current) {
                    pageButton.classList.add("active");
                }

                pageButton.addEventListener("click", function () {
                    searchCategory(page);
                });

                paginationBox.appendChild(pageButton);
            }

            // 다음 페이지 버튼
            const nextButton = document.createElement("button");
            nextButton.className = "page-button";
            nextButton.textContent = "다음";
            nextButton.disabled =
                pagination.current >= pagination.last;

            nextButton.addEventListener("click", function () {
                if (pagination.current < pagination.last) {
                    searchCategory(pagination.current + 1);
                }
            });

            paginationBox.appendChild(nextButton);
        }

        // 이전 검색 결과와 팝업을 지우는 함수
        function clearResults() {
            resultMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            resultMarkers = [];
            resultList.innerHTML = "";
            paginationBox.innerHTML = "";
            currentPagination = null;

            if (activePopup) {
                activePopup.setMap(null);
                activePopup = null;
            }
        }
    </script>
</body>
</html>
