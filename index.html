<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>야구장 주변 맛집 지도</title>

    <style>
        /* 기본 화면 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* 왼쪽 검색 영역과 오른쪽 지도 영역을 나눔 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 사이드바 및 목록 영역 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            padding: 24px;
            overflow-y: auto;
            background-color: #ffffff;
            border-right: 1px solid #dddddd;
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin-top: 0;
            font-size: 22px;
            color: #1a1a1a;
        }

        /* 야구장 선택 드롭다운 */
        .stadium-select-box {
            margin-bottom: 14px;
        }

        .stadium-select-box label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #666666;
            margin-bottom: 6px;
        }

        #stadiumSelect {
            width: 100%;
            padding: 10px;
            border: 2px solid #002b49;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #002b49;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        /* 탭 버튼 스타일 */
        .tab-container {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #555555;
            background-color: #f0f0f0;
            border: 1px solid #cccccc;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-button.active {
            color: #000000;
            background-color: #fee500;
            border-color: #e6ce00;
        }

        /* 안내 문구 */
        #status {
            margin: 0 0 16px 0;
            color: #666666;
            font-size: 13px;
        }

        /* 검색 결과 목록 */
        #resultList {
            padding: 0;
            margin: 0;
            list-style: none;
            flex: 1;
        }

        .place-item {
            padding: 14px 4px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
        }

        .place-item:hover {
            background-color: #f8f8f8;
        }

        .place-name {
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-address {
            margin-bottom: 4px;
            color: #555555;
            font-size: 12px;
        }

        .place-category {
            color: #e65100;
            font-size: 11px;
            font-weight: bold;
        }

        .place-link {
            display: inline-block;
            margin-top: 6px;
            color: #2675d8;
            font-size: 12px;
            text-decoration: none;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background-color: #eeeeee;
        }

        /* 작은 화면 대응 */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                height: 100vh;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 50%;
                padding: 16px;
                border-right: none;
                border-bottom: 1px solid #dddddd;
            }

            #map {
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>

                    <option value="nc">창원 NC파크 (NC)</option>
                    <option value="lotte">부산 사직야구장 (롯데)</option>

            </div>

            <!-- 카테고리 탭 버튼 -->

                <button id="tabCafe" class="tab-button" onclick="switchCategory('cafe')">☕ 카페 (5곳)</button>
            </div>

            <p id="status">야구장을 불러오는 중입니다...</p>

            <!-- 검색 결과 목록 -->
            <ul id="resultList"></ul>
        </aside>

        <!-- 오른쪽 지도 영역 -->
        <div id="map"></div>

    </div>
