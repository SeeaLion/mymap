<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색 서비스</title>
  
  <!-- CSS 스타일 정의 -->
  <style>
    /* 전체 페이지 및 기본 리셋 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 메인 컨테이너: 화면을 좌우 2분할 (Flexbox 이용) */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 패널: 검색창과 결과 리스트 */
    .sidebar {
      width: 380px;
      min-width: 320px;
      height: 100%;
      background-color: #ffffff;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* 사이드바 헤더 영역 */
    .sidebar-header {
      padding: 20px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
    }

    .sidebar-header h1 {
      font-size: 1.25rem;
      color: #333333;
      margin-bottom: 12px;
    }

    /* 검색 폼 스타일 */
    .search-form {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid #ced4da;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #fee500; /* 카카오 대표 노란색 포인트 */
    }

    .search-button {
      padding: 10px 16px;
      background-color: #fee500;
      color: #191919;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-button:hover {
      background-color: #fada00;
    }

    /* 장소 검색 결과 목록 영역 */
    .results-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    /* 결과 항목 개별 카드 스타일 */
    .result-item {
      padding: 16px 20px;
      border-bottom: 1px solid #f1f3f5;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #f8f9fa;
    }

    .result-item .place-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #212529;
      margin-bottom: 4px;
    }

    .result-item .place-address {
      font-size: 0.85rem;
      color: #66d28e;
      color: #495057;
      margin-bottom: 4px;
    }

    .result-item .place-phone {
      font-size: 0.8rem;
      color: #2b8a3e;
    }

    /* 안내 메시지용 클래스 */
    .status-message {
      padding: 30px 20px;
      text-align: center;
      color: #868e96;
      font-size: 0.95rem;
    }

    /* 오른쪽 영역: 지도 표시 부분 */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 현재 위치로 이동하는 버튼 */
    .my-location-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 5;
      background-color: #ffffff;
      border: 1px solid #ced4da;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }

    .my-location-btn:hover {
      background-color: #f8f9fa;
    }
  </style>

  <!-- 
    카카오 지도 JavaScript SDK 불러오기
    - appkey 파라미터에 발급받은 키 입력 (24fe99dfd587292498c30233911527f8)
    - libraries=services : 키워드 장소 검색 기능을 위해 라이브러리 추가 필요
    - autoload=false : 스크립트 로드 후 kakao.maps.load()로 안전하게 실행하기 위해 필수
  -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=24fe99dfd587292498c30233911527f8&libraries=services&autoload=false"></script>
</head>
<body>

  <!-- 애플리케이션 전체 레이아웃 (2분할) -->
  <div class="app-container">
    
    <!-- 왼쪽 사이드바 (검색창 + 결과 목록) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>📍 장소 검색</h1>
        <form id="searchForm" class="search-form">
          <input type="text" id="searchInput" class="search-input" placeholder="검색어를 입력하세요 (예: 강남역 맛집)" required>
          <button type="submit" class="search-button">검색</button>
        </form>
      </div>

      <!-- 검색 결과를 나열할 리스트 -->
      <ul id="resultsList" class="results-list">
        <li class="status-message">검색어를 입력하고 검색 버튼을 누르세요.</li>
      </ul>
    </aside>

    <!-- 오른쪽 지도 영역 -->
    <main class="map-container">
      <div id="map"></div>
      <button id="myLocationBtn" class="my-location-btn">🎯 현재 위치로</button>
    </main>

  </div>

  <!-- JavaScript 소스코드 -->
  <script>
    // 전역 변수 선언 (지도의 상태를 유지하는 중요한 변수들)
    let mapObject = null;         // 카카오 Map 인스턴스
    let placesService = null;     // 장소 검색 서비스 객체
    let activeMarkers = [];       // 지도 위에 생성된 마커들을 관리하는 배열
    let infoWindowObject = null;  // 마커를 클릭했을 때 띄울 정보창

    // 기본 좌표 설정 (위치 권한 미허용 또는 오류 시 사용할 기본 위치: 서울시청)
    const DEFAULT_LATITUDE = 37.566826;
    const DEFAULT_LONGITUDE = 126.978656;
    const DEFAULT_MAP_LEVEL = 5;  // 요청 조건인 지도 확대 레벨 5

    // 카카오맵 SDK 로드가 완료된 후 안전하게 스크립트를 실행
    kakao.maps.load(function () {
      initializeMap();
      setupEventListeners();
    });

    /**
     * 지도를 생성하고 초기에 내 위치를 가져와 세팅하는 함수
     */
    function initializeMap() {
      const mapContainer = document.getElementById('map');
      
      // 초기 지도 옵션 생성
      const mapOptions = {
        center: new kakao.maps.LatLng(DEFAULT_LATITUDE, DEFAULT_LONGITUDE),
        level: DEFAULT_MAP_LEVEL // 지도 확대 레벨 5 설정
      };

      // 카카오 지도 객체 및 장소 검색 서비스 생성
      mapObject = new kakao.maps.Map(mapContainer, mapOptions);
      placesService = new kakao.maps.services.Places();
      infoWindowObject = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 사용자 내 위치 가져오기 (위치 권한 요청)
      fetchUserCurrentLocation();
    }

    /**
     * 이벤트 리스너를 한곳에 모아 등록하는 함수
     */
    function setupEventListeners() {
      // 검색 폼 제출(Submit) 이벤트 처리
      const searchForm = document.getElementById('searchForm');
      searchForm.addEventListener('submit', function (event) {
        event.preventDefault(); // 폼 제출 시 페이지가 새로고침되는 현상 방지
        const keyword = document.getElementById('searchInput').value.trim();
        if (keyword) {
          searchPlacesByKeyword(keyword);
        }
      });

      // '현재 위치로' 버튼 클릭 이벤트
      const myLocationBtn = document.getElementById('myLocationBtn');
      myLocationBtn.addEventListener('click', function () {
        fetchUserCurrentLocation();
      });
    }

    /**
     * HTML5 Geolocation API로 내 현재 위치 권한을 확인하고 지도를 내 위치로 이동시키는 함수
     */
    function fetchUserCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const currentLat = position.coords.latitude;
            const currentLng = position.coords.longitude;
            const currentPosition = new kakao.maps.LatLng(currentLat, currentLng);

            // 지도 중심을 현재 위치로 이동
            mapObject.setCenter(currentPosition);

            // 현재 위치 표시용 별도 마커 추가
            displayCurrentLocationMarker(currentPosition);
          },
          function (error) {
            console.warn('위치 권한을 불러올 수 없습니다:', error.message);
            alert('위치 권한이 거부되었거나 가져올 수 없어 기본 위치(서울시청)로 설정됩니다.');
          }
        );
      } else {
        alert('이 브라우저에서는 Geolocation(위치 서비스)을 지원하지 않습니다.');
      }
    }

    /**
     * 현재 내 위치에 특별한 마커 표시
     */
    function displayCurrentLocationMarker(position) {
      // 기존 마커 지우기
      clearPreviousMarkers();

      const marker = new kakao.maps.Marker({
        map: mapObject,
        position: position
      });

      activeMarkers.push(marker);

      // 정보창(InfoWindow) 생성
      infoWindowObject.setContent('<div style="padding:5px 10px;font-size:12px;color:#333;">📍 현재 내 위치</div>');
      infoWindowObject.open(mapObject, marker);
    }

    /**
     * 키워드로 카카오 장소 검색을 수행하는 함수
     */
    function searchPlacesByKeyword(keyword) {
      // 카카오 키워드 검색 실행
      placesService.keywordSearch(keyword, handlePlacesSearchCallback);
    }

    /**
     * 카카오 장소 검색 결과를 받아 처리하는 콜백 함수
     */
    function handlePlacesSearchCallback(data, status) {
      const resultsListElement = document.getElementById('resultsList');

      if (status === kakao.maps.services.Status.OK) {
        // 검색 성공 시 이전 결과 및 마커 초기화
        clearPreviousMarkers();
        resultsListElement.innerHTML = '';

        const bounds = new kakao.maps.LatLngBounds();

        // 검색된 장소 목록 순회
        data.forEach(function (place, index) {
          const placePosition = new kakao.maps.LatLng(place.y, place.x);

          // 지도 위에 마커 생성
          const marker = createMarkerOnMap(placePosition, place);
          
          // 리스트 항목 HTML 요소 생성
          const listItem = createPlaceListItemElement(place, marker);
          resultsListElement.appendChild(listItem);

          // 검색된 장소들이 모두 보이도록 영역 범위 확장
          bounds.extend(placePosition);
        });

        // 지도 범위를 검색 결과에 맞추어 변경
        mapObject.setBounds(bounds);

      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        resultsListElement.innerHTML = '<li class="status-message">검색 결과가 존재하지 않습니다.</li>';
      } else if (status === kakao.maps.services.Status.ERROR) {
        resultsListElement.innerHTML = '<li class="status-message">검색 중 오류가 발생했습니다.</li>';
      }
    }

    /**
     * 지도상에 마커를 생성하고 이벤트 연결
     */
    function createMarkerOnMap(position, place) {
      const marker = new kakao.maps.Marker({
        position: position,
        map: mapObject
      });

      // 마커 클릭 시 정보창 표시
      kakao.maps.event.addListener(marker, 'click', function () {
        const content = `<div style="padding:8px 12px;font-size:13px;font-weight:bold;">${place.place_name}</div>`;
        infoWindowObject.setContent(content);
        infoWindowObject.open(mapObject, marker);
      });

      activeMarkers.push(marker);
      return marker;
    }

    /**
     * 좌측 사이드바 결과 리스트의 개별 HTML 아이템 생성
     */
    function createPlaceListItemElement(place, marker) {
      const li = document.createElement('li');
      li.className = 'result-item';

      const addressText = place.road_address_name ? place.road_address_name : place.address_name;
      const phoneText = place.phone ? place.phone : '전화번호 정보 없음';

      li.innerHTML = `
        <div class="place-title">${place.place_name}</div>
        <div class="place-address">${addressText}</div>
        <div class="place-phone">${phoneText}</div>
      `;

      // 리스트 항목 클릭 시 해당 위치로 이동 및 정보창 띄우기
      li.addEventListener('click', function () {
        const movePosition = new kakao.maps.LatLng(place.y, place.x);
        mapObject.panTo(movePosition);
        
        const content = `<div style="padding:8px 12px;font-size:13px;font-weight:bold;">${place.place_name}</div>`;
        infoWindowObject.setContent(content);
        infoWindowObject.open(mapObject, marker);
      });

      return li;
    }

    /**
     * 기존에 지도에 찍힌 마커들을 모두 지우는 정리 함수
     */
    function clearPreviousMarkers() {
      activeMarkers.forEach(function (marker) {
        marker.setMap(null);
      });
      activeMarkers = [];
      infoWindowObject.close();
    }
  </script>
</body>
</html>
